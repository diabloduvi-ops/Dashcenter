global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 400

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 8s
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 5s

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}

    # Dashcenter reads only the ping, version, and container list endpoints.
    # Container inspect exposes Config.Env and must remain unavailable.
    acl allowed_ping path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$
    acl allowed_version path,url_dec -m reg -i ^(/v[0-9.]+)?/version$
    acl allowed_list path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$

    http-request deny unless METH_GET
    http-request deny unless allowed_ping or allowed_version or allowed_list
    default_backend dockerbackend
