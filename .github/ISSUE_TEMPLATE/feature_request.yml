name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature planning happens in GitHub Issues. Describe the problem and the useful outcome before proposing implementation details.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe how the finished feature should behave.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard and widgets
        - Services and native plugins
        - Appearance and design
        - Deployment and operations
        - Import, export and backups
        - Authentication and users
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related tools.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: This request does not contain credentials or private data.
          required: true
