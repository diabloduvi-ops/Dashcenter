name: Bug report
description: Report a reproducible Dashcenter problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Dashcenter. Remove passwords, tokens, cookies, private URLs and personal data before submitting. Report security problems through the private advisory link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Dashcenter version
      description: Copy the version and revision from /api/healthz or the container labels.
      placeholder: v1.x.y, revision abc1234
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Portainer Stack
        - Dashboard-only Docker container
        - Node.js from source
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and where it appears.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Configure ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Redact secrets, private addresses and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reproduced this on the latest release.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
