name: Publish DashCenter images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish DashCenter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/diabloduvi-ops/dashcenter:${{ steps.version.outputs.value }}
            ghcr.io/diabloduvi-ops/dashcenter:latest
          build-args: |
            DASHCENTER_VERSION=${{ steps.version.outputs.value }}
            DASHCENTER_REVISION=${{ github.sha }}
      - name: Publish Docker proxy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.proxy
          push: true
          tags: |
            ghcr.io/diabloduvi-ops/dashcenter-docker-proxy:${{ steps.version.outputs.value }}
            ghcr.io/diabloduvi-ops/dashcenter-docker-proxy:latest
          build-args: |
            DASHCENTER_VERSION=${{ steps.version.outputs.value }}

            
