name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Audit production licences
        run: pnpm licenses:check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate Docker metadata gateway configuration
        run: >-
          docker run --rm
          -e SOCKET_PATH=/var/run/docker.sock
          -v "$PWD/docker/docker-proxy.haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro"
          ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
          haproxy -c -f /tmp/haproxy.cfg

      - name: Build production containers
        run: DASHCENTER_REVISION="${{ github.sha }}" docker compose build
